name: Windows-EXE bauen

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "pyinstaller>=6.6"

      - name: Selbsttest (Quellcode)
        run: python tests/test_core.py

      - name: Version lesen
        id: ver
        shell: bash
        run: echo "version=$(python -c 'from app.version import APP_VERSION; print(APP_VERSION)')" >> "$GITHUB_OUTPUT"

      - name: EXE bauen (PyInstaller)
        run: pyinstaller --noconfirm --clean 3D-Vergleich-MK1.spec

      - name: Selbsttest (fertige EXE)
        shell: pwsh
        run: |
          $env:SELFTEST_LOG = "$PWD\selftest.txt"
          $p = Start-Process -FilePath "dist\3D-Vergleich-MK1.exe" -ArgumentList "--selftest" -Wait -PassThru
          if (Test-Path selftest.txt) { Get-Content selftest.txt }
          if ($p.ExitCode -ne 0) { Write-Error "Selbsttest der EXE fehlgeschlagen"; exit 1 }

      - name: Paket schnüren
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force release | Out-Null
          Copy-Item "dist\3D-Vergleich-MK1.exe" release\
          Copy-Item README.md release\
          Compress-Archive -Path release\* -DestinationPath "3D-Vergleich-MK1-v${{ steps.ver.outputs.version }}-windows.zip" -Force

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: 3D-Vergleich-MK1-v${{ steps.ver.outputs.version }}-windows
          path: release/

      - name: Release veröffentlichen (bei Tag v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: 3D-Vergleich-MK1-v${{ steps.ver.outputs.version }}-windows.zip
